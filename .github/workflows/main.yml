name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Stockfish
        run: |
          wget -O stockfish.tar.gz https://stockfish.s3.amazonaws.com/stockfish-15-android-arm64.tar.gz
          tar -xzf stockfish.tar.gz
          mkdir -p app/src/main/assets/
          mv stockfish/stockfish app/src/main/assets/stockfish || true

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chess-Assistant
          path: app/build/outputs/apk/debug/*.apk
